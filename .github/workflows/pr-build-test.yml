name: PR Build and Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.entityMode }} EntityId)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entityMode: [uint, ulong]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CoreECS.sln

      - name: Build CoreECS (uint EntityId)
        if: matrix.entityMode == 'uint'
        run: dotnet build CoreECS.sln --configuration Release --no-restore

      - name: Build CoreECS (ulong EntityId)
        if: matrix.entityMode == 'ulong'
        run: dotnet build CoreECS.sln --configuration Release --no-restore -p:CoreECSUseUlongEntity=true

      - name: Run automated tests (uint EntityId)
        if: matrix.entityMode == 'uint'
        run: dotnet test CoreECS.sln --configuration Release --no-build --verbosity normal

      - name: Run automated tests (ulong EntityId)
        if: matrix.entityMode == 'ulong'
        run: dotnet test CoreECS.sln --configuration Release --no-build --verbosity normal -p:CoreECSUseUlongEntity=true
